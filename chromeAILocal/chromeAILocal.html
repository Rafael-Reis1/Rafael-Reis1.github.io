<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/libs_comuns/fonts.css?v=1611260410">
    <link rel="stylesheet" href="style.css?v=1611260410">
    <link rel="stylesheet" href="lib/atom-one-dark.min.css?v=1611260410">
    <script defer src="lib/marked.min.js?v=1611260410"></script>
    <script defer src="lib/purify.min.js?v=1611260410"></script>
    <script defer src="lib/highlight.min.js?v=1611260410"></script>
    <meta http-equiv="origin-trial"
        content="Aj03smeBgQEzFx/0w0w0+cJGrP6DIUwzXRkKe9/cL96CHKeyPsvsuAYPs8pHxrK6u2nnc7Y7BiJSyG1kszo06AkAAAB9eyJvcmlnaW4iOiJodHRwczovL3JhZmFlbC1yZWlzMS5naXRodWIuaW86NDQzIiwiZmVhdHVyZSI6IkFJUHJvbXB0QVBJTXVsdGltb2RhbElucHV0IiwiZXhwaXJ5IjoxNzgxNTY4MDAwLCJpc1N1YmRvbWFpbiI6dHJ1ZX0=">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=1611260410">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#06071a">
    <title>NanoChat - IA Local</title>
</head>

<body>
    <div id="mobile-notice" class="mobile-notice-overlay">
        <div class="notice-card">
            <div class="notice-icon">🖥️</div>
            <h2>Acesso apenas via Desktop</h2>
            <p>No momento, o <strong>NanoChat</strong> e a tecnologia Gemini Nano são suportados apenas na versão para computador do Google Chrome.</p>
            <button onclick="window.location.href='/'" class="btn-primary" style="width: 100%; justify-content: center;">
                Voltar para a Home
            </button>
            <button type="button" id="btnDismissMobileNotice" class="btn-secondary btn-mobile-continue">
                Continuar mesmo assim
            </button>
        </div>
    </div>

    <button id="menuButton" class="menu-button" aria-label="Abrir Menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-header-row">
                <button type="button" id="btnNewChat" class="btn-new-chat">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Novo Chat</span>
                </button>
                <button type="button" id="btnToggleSidebarCollapse" class="btn-sidebar-collapse"
                    title="Recolher barra lateral" aria-label="Recolher barra lateral" aria-expanded="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="3" x2="9" y2="21"></line>
                    </svg>
                </button>
            </div>
            <div class="chat-search-box">
                <svg class="chat-search-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="search" id="chatSearchInput" class="chat-search-input"
                    placeholder="Buscar conversas..." aria-label="Buscar conversas" autocomplete="off">
                <button type="button" id="btnClearSearch" class="chat-search-clear" style="display: none;"
                    title="Limpar busca" aria-label="Limpar busca">&times;</button>
            </div>
        </div>
        <div class="chat-list" id="chatList">
        </div>
        <div class="sidebar-footer">
            <button class="btnVoltar" id="btnInstallApp" style="display: none; margin-bottom: 10px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span>Instalar App</span>
            </button>

            <button class="btnVoltar" id="btnPersonas" style="margin-bottom: 10px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Personas</span>
            </button>
            <button class="btnVoltar" id="btnVoltar">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Home</span>
            </button>
        </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <div class="main-wrapper" id="mainWrapper">
        <div class="container">
            <header class="chat-topbar" id="chatTopbar">
                <div class="chat-topbar-left">
                    <button type="button" id="activePersonaChip" class="persona-chip" title="Trocar ou gerenciar Personas">
                        <span class="persona-chip-icon">🤖</span>
                        <span class="persona-chip-name">Padrão</span>
                    </button>
                    <span id="activeChatTitle" class="chat-topbar-title">Novo Chat</span>
                </div>
                <div class="chat-topbar-right">
                    <button type="button" id="btnOpenCanvasHeader" class="topbar-btn topbar-canvas-btn"
                        style="display: none;" title="Abrir Preview HTML">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <span>Preview</span>
                    </button>
                    <button type="button" id="aiStatusBadge" class="ai-status-badge status-warn"
                        title="Verificar disponibilidade do Chrome AI">
                        <span class="ai-status-dot" aria-hidden="true"></span>
                        <span class="ai-status-label">Verificando IA...</span>
                    </button>
                    <button type="button" id="btnExportChatMd" class="topbar-icon-btn"
                        title="Exportar conversa em Markdown (.md)" aria-label="Exportar conversa em Markdown" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                    </button>
                    <button type="button" id="btnClearChat" class="topbar-icon-btn danger"
                        title="Limpar mensagens desta conversa" aria-label="Limpar mensagens" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>
            </header>
            <div class="messages" id="messages"></div>

            <button id="scrollToBottomBtn" class="scroll-bottom-btn" type="button"
                aria-label="Ir para o fim da conversa" title="Ir para o fim">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <polyline points="19 12 12 19 5 12"></polyline>
                </svg>
                <span class="scroll-bottom-dot" aria-hidden="true"></span>
            </button>

            <div class="form-group">
                <textarea name="promptText" id="promptText" class="form-control" rows="1"
                    placeholder="Digite sua mensagem para a IA..." autofocus></textarea>

                <button id="sendButton" aria-label="Enviar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        class="icon-send">
                        <path d="M7 11L12 6L17 11M12 18V7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>

                <button id="stopButton" style="display: none;" aria-label="Parar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="icon-stop">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    </svg>
                </button>
            </div>
        </div>

        <div class="canvas-container" id="canvasContainer">
            <div class="canvas-header">
                <span class="canvas-title">Preview</span>
                <div class="canvas-actions">
                    <button type="button" id="copyCanvas" class="canvas-btn" title="Copiar HTML" aria-label="Copiar HTML">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                    <button type="button" id="downloadCanvas" class="canvas-btn" title="Baixar HTML" aria-label="Baixar HTML">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                    </button>
                    <button type="button" id="refreshCanvas" class="canvas-btn" title="Atualizar" aria-label="Atualizar preview">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                    </button>
                    <button type="button" id="closeCanvas" class="canvas-btn" title="Fechar" aria-label="Fechar preview">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <iframe id="canvasFrame" sandbox="allow-scripts allow-same-origin allow-modals"></iframe>
        </div>
    </div>

    <div class="modal" id="personasModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Personas / Assistentes</h2>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div id="personasList" class="personas-list">
                </div>

                <div id="personaEditor" class="persona-editor" style="display: none;">
                    <div class="modal-form-group">
                        <label for="inputPersonaName">Nome</label>
                        <input type="text" id="inputPersonaName" class="modal-input"
                            placeholder="Ex: Professor de Inglês">
                    </div>
                    <div class="modal-form-row">
                        <div class="modal-form-group">
                            <label for="inputPersonaColor">Cor</label>
                            <div style="position: relative;">
                                <div id="inputPersonaColor" class="color-preview" style="background: #f2511b;"></div>
                                <div id="colorPicker" class="color-picker" style="display: none;"></div>
                            </div>
                        </div>
                        <div class="modal-form-group">
                            <label for="inputPersonaIcon">Ícone (Emoji)</label>
                            <div style="position: relative;">
                                <input type="text" id="inputPersonaIcon" class="modal-input text-center"
                                    placeholder="🤖" maxlength="4"
                                    style="width: 80px; cursor: pointer; caret-color: transparent; user-select: none;"
                                    readonly>
                                <div id="emojiPicker" class="emoji-picker" style="display: none;"></div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-form-group">
                        <label for="inputPersonaPrompt">Prompt de Sistema</label>
                        <textarea id="inputPersonaPrompt" class="modal-input"
                            placeholder="Ex: Você é um professor. Corrija gramática..." rows="12"></textarea>
                    </div>
                    <div class="editor-actions">
                        <button id="btnSavePersona" class="btn-primary">Salvar</button>
                        <button id="btnCancelPersona" class="btn-secondary">Cancelar</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="footer-row">
                    <button id="btnAddPersona" class="btn-primary-outline">+ Nova Persona</button>
                    <div class="footer-icon-buttons">
                        <button id="btnImportPersona" class="btn-icon-small" title="Importar Personas">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                        </button>
                        <button id="btnExportAllPersonas" class="btn-icon-small" title="Exportar Personas">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="footer-chats-row">
                    <button id="btnImportChats" class="btn-chat-action">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Importar Chats
                    </button>
                    <button id="btnExportChats" class="btn-chat-action">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        Exportar Chats
                    </button>
                </div>
                <input type="file" id="importPersonaFile" accept=".json" style="display: none;">
                <input type="file" id="importChatsFile" accept=".json" style="display: none;">
            </div>
        </div>
    </div>

    <div class="modal" id="genericModal">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2 id="genericModalTitle">Atenção</h2>
                <button class="close-modal" id="closeGenericModal">&times;</button>
            </div>
            <div class="modal-body">
                <p id="genericModalMessage"></p>
                <input type="text" id="genericModalInput" class="modal-input" style="display: none; margin-top: 1rem;"
                    autocomplete="off">
            </div>
            <div class="modal-footer" id="genericModalFooter"
                style="flex-direction: row; justify-content: flex-end; padding-top: 1rem; gap: 0.5rem;">
                <button id="genericModalCancelBtn" class="btn-secondary" style="display: none;">Cancelar</button>
                <button id="genericModalOkBtn" class="btn-primary">OK</button>
            </div>
        </div>
    </div>

    <script defer src="app.js?v=1611260410"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js?v=1611260410');
            });
        }
    </script>
</body>

</html>
