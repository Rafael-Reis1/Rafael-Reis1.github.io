<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Lista Compartilhada - Gerenciador de Leitura">
    <title>Lista Compartilhada</title>
    
    <link rel="stylesheet" href="../assets/libs_comuns/fonts.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <meta name="theme-color" content="#0f0c29">

    <script src="../assets/libs_comuns/firebase/10.7.1/firebase-app-compat.js"></script>
    <script src="../assets/libs_comuns/firebase/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
        }
        .main-content {
            margin-left: 0;
            width: 100%;
            height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding: 0 1rem;
            gap: 1rem;
        }
        .header h1 {
            flex: 1;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 1.2rem;
            color: var(--accent-color);
        }
        .header-actions {
            flex-shrink: 0;
        }
        .header-left {
            display: contents;
        }
        #loadingMsg, #errorMsg {
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            padding: 0 2rem;
            color: var(--text-secondary);
            font-size: 1.1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 70px);
            margin: 0;
            gap: 1rem;
        }
        #errorMsg {
            color: #ef4444;
        }
        .book-card {
            cursor: pointer;
        }
        .book-status, .book-favorite, .book-menu-btn, .book-rating-badge {
            display: none !important; 
        }
        
        .book-card .title-overlay {
            border-bottom: 3px solid var(--accent-color) !important;
            background: linear-gradient(to top, rgba(242, 81, 27, 0.95) 0%, rgba(242, 81, 27, 0.4) 60%, transparent) !important;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-left">
                <h1 id="listTitle">Carregando Lista...</h1>
            </div>
            <div class="header-actions">
                <a href="reading.html" class="btn btn-secondary" style="text-decoration: none;">Crie a sua também</a>
            </div>
        </header>

        <main class="main-content">
            <div id="loadingMsg">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite;">
                    <line x1="12" y1="2" x2="12" y2="6"></line>
                    <line x1="12" y1="18" x2="12" y2="22"></line>
                    <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                    <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                    <line x1="2" y1="12" x2="6" y2="12"></line>
                    <line x1="18" y1="12" x2="22" y2="12"></line>
                    <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                    <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
                </svg>
                Carregando livros...
            </div>
            <div id="errorMsg" style="display: none;"></div>
            
            <div class="scrollable-content" style="width: 100%; height: 100%;">
                <div class="books-grid" id="booksGrid" style="display: none;">
                </div>
            </div>
        </main>
    </div>

    <script src="share.js"></script>
    <style>
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</body>
</html>
